name: AlphaBrain CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test (all)
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: E15 gate (adiabatic invariant)
        run: cargo run --bin run-alpha-phase1 2>&1 | grep "E15" | grep -q "PASS"
      - name: E16a gate (crystallization)
        run: cargo run --bin run-alpha-phase1 2>&1 | grep "E16a" | grep -q "PASS"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit
        run: cargo install cargo-audit --quiet
      - name: Audit
        run: cargo audit
