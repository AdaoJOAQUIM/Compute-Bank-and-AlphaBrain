[package]
name = "alpha-findings"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "run-alpha-phase1"
path = "src/main.rs"

[dependencies]
alpha-core = { path = "../alpha-core" }
alpha-sim = { path = "../alpha-sim" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
